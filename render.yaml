services:
  - type: web
    name: learnify-api
    runtime: node
    rootDir: server
    buildCommand: npm install && node scripts/install-puppeteer-chrome.js
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: PUPPETEER_CACHE_DIR
        value: .cache/puppeteer
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://learnify-azure-three.vercel.app,http://localhost:5173
